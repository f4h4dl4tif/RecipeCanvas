<html><body style="font-family: -apple-system, Helvetica; font-size: 13px;">
<h2>RecipeCanvas is installed</h2>
<p>It's in your Applications folder and should already be open.</p>
<ul>
<li>Two sample recipes with history are added on first launch.</li>
<li>Press <b>⌘S</b> to save the draft as a new version.</li>
<li>Press <b>⌘K</b> for Cook Mode and <b>⌘P</b> to print a recipe card.</li>
</ul>
</body></html>
